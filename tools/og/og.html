<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Images de partage 1200×630 : node tools/og/render.js -->
<style>
@font-face { font-family: Archivo; src: url("../../assets/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #000; color: #f5f5f7; font-family: Archivo, sans-serif; position: relative; }
.glow { position: absolute; right: -80px; top: 40px; width: 760px; height: 760px; background: radial-gradient(closest-side, rgba(47,107,255,.42), transparent 70%); }
.machine { position: absolute; right: 120px; top: 56px; height: 640px; -webkit-mask-image: linear-gradient(#000 70%, transparent 96%); }
.txt { position: absolute; left: 80px; top: 40px; bottom: 40px; width: 590px; display: flex; flex-direction: column; justify-content: center; }
.logo { font-weight: 800; letter-spacing: .32em; font-size: 22px; color: #a1a1a6; }
.kicker { margin-top: 26px; font-size: 24px; font-weight: 600; color: #8fb1ff; }
h1 { margin: 10px 0 0; font-size: 66px; line-height: 1.02; letter-spacing: -.035em; font-weight: 780; }
.sub { margin-top: 24px; font-size: 24px; line-height: 1.35; color: #a1a1a6; }
.bar { margin-top: 28px; font-size: 20px; color: #6e6e73; }
</style></head>
<body>
<div class="glow"></div>
<img class="machine" src="../../assets/img/machine.webp" alt="">
<div class="txt">
  <p class="logo">AIRO</p>
  <p class="kicker" id="k"></p>
  <h1 id="t"></h1>
  <p class="sub" id="s"></p>
  <p class="bar">Vapeur sèche · Désinfection · Séchage · Deux casiers</p>
</div>
</body></html>
