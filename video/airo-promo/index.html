<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>AIRO — Propre en 10 minutes</title>
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; background: #05060b; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #eef1f6; font-family: "Archivo", sans-serif;
    background: radial-gradient(70% 45% at 50% 42%, #0f1d44 0%, #080b16 62%, #05060b 100%); }
  .clip { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(2, 3, 8, .6)); pointer-events: none; }
  .cap { font-stretch: 62%; font-weight: 800; line-height: .9; letter-spacing: -.01em; margin: 0; }
  .small { font-size: 40px; font-weight: 600; letter-spacing: .06em; color: #9fb6ff; margin: 0; }
  .row { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cone { position: absolute; left: -10px; right: -10px; top: -260px; height: 1700px; background: linear-gradient(180deg, rgba(200, 215, 255, .24), rgba(200, 215, 255, 0) 82%);
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter: blur(10px); }
  .glass { position: absolute; border-radius: 30px; overflow: hidden; background: #070a14;
    box-shadow: 0 0 0 2px rgba(47, 107, 255, .7), 0 0 70px rgba(47, 107, 255, .45), 0 40px 120px rgba(0, 0, 0, .6); }
  .glass canvas { display: block; width: 100%; height: 100%; }
  .grain { position: absolute; inset: 0; opacity: .05; pointer-events: none;
    background-image: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 71% 64%, #fff 0 1px, transparent 1px 4px); }
  /* plan 1 */
  .drop { position: absolute; width: 6px; height: 18px; border-radius: 3px; background: rgba(170, 195, 255, .38); }
  .word { display: block; }
  /* plan 2 */
  #s2-shot { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* plan 3 */
  #s3-chip { display: inline-block; font-size: 150px; padding: 14px 44px 6px; border-radius: 26px; background: #2f6bff; color: #eef1f6; }
  /* plan 4 : manomètre de vapeur */
  #s4-glow { position: absolute; left: 112px; top: 172px; width: 856px; height: 1076px; border-radius: 36px; overflow: hidden; }
  #s4-glow-spin { position: absolute; left: -400px; top: -400px; width: 1656px; height: 1876px;
    background: conic-gradient(from 0deg, rgba(47, 107, 255, 0), #2f6bff 18%, rgba(140, 180, 255, .9) 24%, rgba(47, 107, 255, 0) 40%, rgba(47, 107, 255, 0) 60%, #2f6bff 78%, rgba(47, 107, 255, 0)); }
  #s4-mano { position: absolute; left: 290px; top: 1270px; width: 500px; height: 300px; }
  .fog { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(225, 235, 255, .55), rgba(225, 235, 255, 0) 70%); }
  /* plan 6 */
  #s6-logo { position: absolute; left: 290px; top: 560px; width: 500px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="17.2">

  <!-- 1 · Accroche -->
  <section id="s1" class="clip" data-start="0" data-duration="1.8" data-track-index="1">
    <div id="s1-drops"></div>
    <div class="row" style="top:640px">
      <p class="cap" style="font-size:150px"><span class="word" id="s1-w1">TON CASQUE</span><span class="word" id="s1-w2">GARDE TOUT.</span></p>
      <p class="small" id="s1-sub" style="margin-top:50px">SUEUR · BACTÉRIES · ODEURS</p>
    </div>
    <div class="vignette"></div>
  </section>

  <!-- 2 · Révélation -->
  <section id="s2" class="clip" data-start="1.8" data-duration="1.6" data-track-index="1">
    <div id="s2-cam" style="position:absolute;inset:0">
      <canvas id="s2-shot" width="1080" height="1920"></canvas>
    </div>
    <div class="cone" id="s2-cone"></div>
    <div class="vignette"></div>
  </section>

  <!-- 3 · Programme -->
  <section id="s3" class="clip" data-start="3.4" data-duration="2.8" data-track-index="1">
    <div class="glass" id="s3-panel" style="left:80px;top:250px;width:920px;height:1240px"><canvas id="s3-shot" width="920" height="1240"></canvas></div>
    <div class="row" style="top:1560px"><span class="cap" id="s3-chip">10 MIN</span></div>
    <div class="vignette"></div>
  </section>

  <!-- 4 · Vapeur sèche + manomètre -->
  <section id="s4" class="clip" data-start="6.2" data-duration="5" data-track-index="1">
    <div id="s4-bg" style="position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 35%,#16295e,#070a14 70%)"></div>
    <div id="s4-glow"><div id="s4-glow-spin"></div></div>
    <div class="glass" id="s4-panel" style="left:120px;top:180px;width:840px;height:1060px;box-shadow:0 40px 120px rgba(0,0,0,.6)"><canvas id="s4-shot" width="840" height="1060"></canvas></div>
    <svg id="s4-mano" viewBox="0 0 500 300">
      <path d="M50 260 A200 200 0 0 1 450 260" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="22" stroke-linecap="round"/>
      <path id="s4-arc" d="M50 260 A200 200 0 0 1 450 260" fill="none" stroke="#2f6bff" stroke-width="22" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <circle id="s4-plume" cx="50" cy="260" r="30" fill="rgba(220,232,255,.6)" style="filter:blur(6px)"/>
      <text id="s4-time" x="250" y="250" text-anchor="middle" font-family="Archivo" font-weight="800" font-stretch="62%" font-size="96" fill="#eef1f6">0:00</text>
    </svg>
    <div id="s4-fog"></div>
    <div class="row" style="top:1600px">
      <p class="cap" id="s4-t1" style="font-size:96px">VAPEUR SÈCHE</p>
      <p class="small" id="s4-t2" style="margin-top:20px">99,9 % DES BACTÉRIES</p>
    </div>
    <div class="vignette"></div>
  </section>

  <!-- 5 · Prêt -->
  <section id="s5" class="clip" data-start="11.2" data-duration="2.5" data-track-index="1">
    <div id="s5-iris" style="position:absolute;inset:0">
      <div class="glass" id="s5-panel" style="left:60px;top:200px;width:960px;height:1200px"><canvas id="s5-shot" width="960" height="1200"></canvas></div>
      <div class="row" style="top:1480px">
        <p class="cap" style="font-size:150px"><span class="word" id="s5-w1">PROPRE.</span><span class="word" id="s5-w2">SEC. PRÊT.</span></p>
      </div>
    </div>
    <div id="s5-wash" style="position:absolute;left:0;top:0;width:1080px;height:1920px;background:#2f6bff;opacity:0"></div>
  </section>

  <!-- 6 · Fin -->
  <section id="s6" class="clip" data-start="13.7" data-duration="3.5" data-track-index="1">
    <div id="s6-bg" style="position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 40%,#1a3a9a 0%,#0a1230 60%,#05060b 100%)"></div>
    <div class="cone" id="s6-cone" style="left:-220px;right:-220px"></div>
    <img id="s6-logo" src="assets/logo.png" alt="AIRO">
    <div class="row" style="top:1150px">
      <p class="small" id="s6-t1" style="color:#c9d2ea;font-size:46px">BORNE EN LIBRE-SERVICE</p>
      <p class="cap" id="s6-t2" style="font-size:80px;margin-top:30px">@AIRO.OFFICIEL</p>
    </div>
    <div class="vignette"></div>
  </section>

  <audio id="sfx" src="assets/audio/sfx.m4a" data-start="0" data-duration="17.2" data-track-index="2"></audio>
  <div class="grain"></div>
</div>

<script>
// Séquences d'images de la borne (film du site, studio noir) dessinées dans des canvas : seek-safe.
const FR = {};
const need = [0, ...Array.from({ length: 9 }, (_, i) => 40 + i), ...Array.from({ length: 66 }, (_, i) => 70 + i)];
const load = (i) => new Promise((res) => { const im = new Image(); im.onload = () => { FR[i] = im; res(); }; im.onerror = res; im.src = `assets/hd/${String(i).padStart(3, "0")}.webp`; });
function drawCover(id, i, focusY = 0.3) {
  const c = document.getElementById(id), g = c.getContext("2d"), im = FR[i];
  if (!im) return;
  const s = Math.max(c.width / im.naturalWidth, c.height / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s;
  g.fillStyle = "#070a14"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(im, (c.width - w) / 2, (c.height - h) * focusY, w, h);
}
const seq = (a, b, k) => Math.round(a + (b - a) * Math.min(1, Math.max(0, k)));

// gouttes (plan 1) : positions fixes, pas d'aléatoire
const dropsEl = document.getElementById("s1-drops");
[[140, 300], [330, 180], [760, 260], [920, 420], [220, 1300], [850, 1350], [560, 1500], [400, 420], [640, 120], [90, 900], [990, 980], [480, 1720]].forEach(([x, y], k) => {
  const d = document.createElement("i"); d.className = "drop"; d.id = "drop" + k; d.style.left = x + "px"; d.style.top = y + "px"; dropsEl.appendChild(d);
});
// buée sur le manomètre (plan 4)
const fogEl = document.getElementById("s4-fog");
[[330, 1300, 120], [470, 1350, 90], [600, 1290, 140], [700, 1380, 80], [400, 1420, 100]].forEach(([x, y, r], k) => {
  const f = document.createElement("i"); f.className = "fog"; f.id = "fog" + k; Object.assign(f.style, { left: x + "px", top: y + "px", width: r + "px", height: r + "px" }); fogEl.appendChild(f);
});

Promise.all([...need.map(load), document.fonts.ready]).then(() => {
  const tl = gsap.timeline({ paused: true });

  // 1 · Accroche : les mots tombent, la buée glisse ; gel des 6 dernières images
  tl.fromTo("#s1-w1", { yPercent: 60, opacity: 0, scale: 1.25 }, { yPercent: 0, opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 0.12);
  tl.fromTo("#s1-w2", { yPercent: 60, opacity: 0, scale: 1.25 }, { yPercent: 0, opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 0.42);
  tl.fromTo("#s1-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.85);
  document.querySelectorAll("#s1-drops .drop").forEach((d, k) => {
    tl.fromTo(d, { y: -40, opacity: 0 }, { y: 140 + (k % 4) * 30, opacity: 1, duration: 1.55, ease: "none" }, 0);
  });

  // 2 · Révélation : noir et silence, le projecteur claque, lente avancée, puis on plonge dans la borne
  const s2 = { k: 0 };   // proxy : l'image est (re)dessinée à chaque recherche dans le temps
  tl.fromTo(s2, { k: 0 }, { k: 1, duration: 1.6, ease: "none", onUpdate: () => drawCover("s2-shot", 0, 0) }, 1.8);
  tl.fromTo("#s2-cam", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.08, duration: 1.0, ease: "power4.out" }, 2.05);
  tl.fromTo("#s2-cone", { opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.05 }, { opacity: 0.25, duration: 0.06 }, { opacity: 1, duration: 0.08 }], ease: "none" }, 2.05);
  tl.to("#s2-cam", { scale: 1.9, filter: "blur(10px)", duration: 0.32, ease: "power4.in" }, 3.08);
  tl.to("#s2-cone", { opacity: 0, duration: 0.3 }, 3.1);

  // 3 · Programme : le panneau monte, l'écran choisit « Nettoyage avancé · 10 min », la pastille claque
  const s3 = { k: 0 };
  tl.fromTo("#s3-panel", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.4);
  tl.fromTo(s3, { k: 0 }, { k: 1, duration: 1.0, ease: "power2.inOut", immediateRender: false, onUpdate: () => drawCover("s3-shot", seq(40, 48, s3.k), 0.18) }, 3.45);
  tl.fromTo("#s3-chip", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 4.45);
  tl.to("#s3-panel", { y: -60, duration: 0.5, ease: "power2.in" }, 5.7);

  // 4 · Vapeur : le liseré s'allume, la vapeur monte, le manomètre compte jusqu'à 10 min ; mise au point avant 100 %
  const s4 = { k: 0 };
  tl.fromTo("#s4-glow", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "sine.inOut" }, 6.2);
  tl.fromTo("#s4-glow-spin", { rotation: 0 }, { rotation: 300, duration: 5, ease: "none" }, 6.2);
  tl.fromTo("#s4-panel", { y: 60 }, { y: 0, duration: 0.6, ease: "power2.out" }, 6.2);
  tl.fromTo(s4, { k: 0 }, { k: 1, duration: 4.6, ease: "none", immediateRender: false, onUpdate: () => {
    drawCover("s4-shot", seq(86, 119, s4.k), 0.32);
    const m = Math.min(10, s4.k * 10.6), mm = Math.floor(m), ss = Math.floor((m - mm) * 60);
    document.getElementById("s4-time").textContent = `${mm}:${String(ss).padStart(2, "0")}`;
    const a = Math.PI * (1 - Math.min(1, s4.k * 1.06));   // panache au bout de l'arc
    const p = document.getElementById("s4-plume"); p.setAttribute("cx", 250 + 200 * Math.cos(a)); p.setAttribute("cy", 260 - 200 * Math.sin(a));
  } }, 6.3);
  tl.fromTo("#s4-arc", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 4.35, ease: "none" }, 6.3);
  tl.fromTo("#s4-fog .fog", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.4, duration: 0.8, stagger: 0.08, ease: "power2.out" }, 10.1);
  tl.fromTo("#s4-t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.9);
  tl.fromTo("#s4-t2", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.5);
  tl.to("#s4-bg", { filter: "blur(6px) brightness(.7)", duration: 0.6, ease: "power2.inOut" }, 10.3);
  tl.fromTo("#s4-panel", { filter: "blur(2px)" }, { filter: "blur(0px)", duration: 0.6, ease: "power2.inOut", immediateRender: false }, 10.3);

  // 5 · Prêt : l'iris s'ouvre depuis l'écran, le liseré passe au blanc, le casque ressort
  const s5 = { k: 0 };
  tl.fromTo("#s5-iris", { clipPath: "circle(0% at 50% 22%)" }, { clipPath: "circle(140% at 50% 22%)", duration: 0.55, ease: "power3.out" }, 11.2);
  tl.fromTo(s5, { k: 0 }, { k: 1, duration: 2.0, ease: "power1.inOut", immediateRender: false, onUpdate: () => drawCover("s5-shot", seq(120, 135, s5.k), 0.15) }, 11.2);
  tl.fromTo("#s5-panel", { boxShadow: "0 0 0 2px rgba(47,107,255,.7), 0 0 70px rgba(47,107,255,.45), 0 40px 120px rgba(0,0,0,.6)" },
    { boxShadow: "0 0 0 3px rgba(240,245,255,.95), 0 0 110px rgba(170,200,255,.75), 0 40px 120px rgba(0,0,0,.6)", duration: 0.5, ease: "power2.out" }, 11.6);
  tl.fromTo("#s5-w1", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 11.75);
  tl.fromTo("#s5-w2", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 12.05);
  tl.fromTo("#s5-wash", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, 13.4);

  // 6 · Fin : le bleu devient la scène, le projecteur revient (plus large), le logo se pose
  tl.fromTo("#s6-bg", { opacity: 0.2 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 13.7);
  tl.fromTo("#s6-cone", { opacity: 0 }, { keyframes: [{ opacity: 0.8, duration: 0.05 }, { opacity: 0.3, duration: 0.06 }, { opacity: 1, duration: 0.1 }], ease: "none" }, 13.9);
  tl.fromTo("#s6-logo", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 14.0);
  tl.fromTo("#s6-t1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 14.6);
  tl.fromTo("#s6-t2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 14.85);

  window.__timelines["main"] = tl;
});
</script>
</body>
</html>
